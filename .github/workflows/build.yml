name: Bygg Hem-appen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bygg APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Döp om
        run: cp app/build/outputs/apk/debug/app-debug.apk hem.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hem-apk
          path: hem.apk
      - name: Publicera senaste version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete senaste --yes --cleanup-tag || true
          gh release create senaste hem.apk --title "Hem – senaste" --notes "Byggd automatiskt från ${GITHUB_SHA::7}" --latest
