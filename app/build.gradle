plugins {
    id 'com.android.application'
}

android {
    namespace 'se.william.hem'
    compileSdk 34

    defaultConfig {
        applicationId 'se.william.hem'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '5.2'
    }

    signingConfigs {
        hem {
            storeFile file('hem.keystore')
            storePassword 'hemhem123'
            keyAlias 'hem'
            keyPassword 'hemhem123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.hem
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
